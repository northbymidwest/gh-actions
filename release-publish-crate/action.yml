name: release publish
description: >-
  Exchange an OIDC identity for a short-lived crates.io token (trusted
  publishing), then publish each listed package in order, skipping any that
  release-preflight found already live. Runs in the consumer's own job so the
  OIDC identity is the consumer's release workflow, which is what the crate's
  trusted-publisher entry is bound to. The token exchange runs even on a dry
  run - it is the one step with no offline test - and only the uploads are
  withheld.
inputs:
  packages:
    description: Newline-separated crate names, in publish order.
    required: true
  publish:
    description: >-
      JSON array of the packages to actually upload, from release-preflight's
      'publish' output. A package not in it is skipped (already on crates.io).
    required: true
  args:
    description: Extra flags passed to every 'cargo publish' (e.g. --no-default-features).
    required: false
    default: ""
  dry-run:
    description: When true, exchange the token but upload nothing.
    required: false
    default: "true"
  working-directory:
    description: >-
      Directory to run 'cargo publish' in. Set it when the crate is checked out
      in a subdirectory (a sibling-checkout layout for a path dependency);
      composite steps do not inherit a job's defaults.run.working-directory.
    required: false
    default: "."
runs:
  using: composite
  steps:
    # Trusted publishing: a short-lived token from OIDC, so the repository holds
    # no standing credential that could publish. Runs on a dry run too: the
    # exchange is the part with no offline test, and getting a token publishes
    # nothing. Pinned here (a `uses:` cannot be an expression); Dependabot on
    # gh-actions bumps it.
    - id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
    - name: Publish
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        PACKAGES: ${{ inputs.packages }}
        PUBLISH: ${{ inputs.publish }}
        ARGS: ${{ inputs.args }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
