name: release preflight
description: >-
  The checks a release should pass before anything irreversible happens: the
  version is well formed, every listed Cargo.toml carries it and is no longer
  publish = false, any exact-version pins hold, the v<version> tag does not
  already exist (a protected tag cannot be moved), the changelog has a non-empty
  section for it, cross-repo prerequisites are already on crates.io, and the
  newest completed CI run for this commit is green. It also probes crates.io for
  each package being released and reports which still need uploading, so a
  release that died between two uploads resumes rather than burning a version.
  In dry-run mode the checks that a rehearsal is allowed to fail (publish =
  false, CI, an existing tag, an already-published version) warn instead of
  failing.
inputs:
  version:
    description: The version to release, without a leading v.
    required: true
  dry-run:
    description: Downgrade rehearsal-safe failures to warnings.
    required: false
    default: "true"
  crates:
    description: >-
      Newline-separated paths to the Cargo.toml files that must carry the
      version. Empty to skip the manifest checks.
    required: false
    default: Cargo.toml
  packages:
    description: >-
      Newline-separated crate names, in the order they will be published, whose
      presence on crates.io is probed to drive resume. Empty when there is
      nothing to publish (a tag-only repository).
    required: false
    default: ""
  registry-prereqs:
    description: >-
      Newline-separated 'crate=manifest' pairs. For each, the version required
      of <crate> is read from <manifest>'s dependency line and must already be
      live on crates.io (the cross-repo publish-first ordering). Empty for none.
    required: false
    default: ""
  pins:
    description: >-
      Newline-separated 'manifest|dep|version' triples asserting <manifest>
      pins <dep> as an exact "=<version>" dependency. An empty version field
      means the release version. Empty for none.
    required: false
    default: ""
  changelog:
    description: Path to the changelog that must have a "## <version>" section.
    required: false
    default: CHANGELOG.md
  ci-workflow:
    description: Name of the workflow whose newest completed run must be green.
    required: false
    default: CI
  token:
    description: A token with actions:read, for the CI query (github.token).
    required: true
outputs:
  tag:
    description: 'free when v<version> does not exist yet, otherwise exists.'
    value: ${{ steps.check.outputs.tag }}
  publish:
    description: >-
      JSON array of the packages that still need uploading (all of them for a
      fresh release, the not-yet-live suffix for a resumed one, [] when there is
      nothing to publish). Feed to release-publish-crate's 'publish' input.
    value: ${{ steps.check.outputs.publish }}
  registry:
    description: A one-line human summary of the registry state, for the review.
    value: ${{ steps.check.outputs.registry }}
runs:
  using: composite
  steps:
    - name: Preflight
      id: check
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DRY: ${{ inputs.dry-run }}
        CRATES: ${{ inputs.crates }}
        PACKAGES: ${{ inputs.packages }}
        PREREQS: ${{ inputs.registry-prereqs }}
        PINS: ${{ inputs.pins }}
        CHANGELOG: ${{ inputs.changelog }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/preflight.sh"
