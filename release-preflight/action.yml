name: release preflight
description: >-
  The checks a release should pass before anything irreversible happens: the
  version is well formed, every listed Cargo.toml carries it and is no longer
  publish = false, the v<version> tag does not already exist (a protected tag
  cannot be moved), the changelog has a non-empty section for it, and the
  newest completed CI run for this commit is green. In dry-run mode the checks
  that a rehearsal is allowed to fail (publish = false, CI, an existing tag)
  warn instead of failing.
inputs:
  version:
    description: The version to release, without a leading v.
    required: true
  dry-run:
    description: Downgrade rehearsal-safe failures to warnings.
    required: false
    default: "true"
  crates:
    description: >-
      Newline-separated paths to the Cargo.toml files that must carry the
      version. Empty to skip the manifest checks.
    required: false
    default: Cargo.toml
  changelog:
    description: Path to the changelog that must have a "## <version>" section.
    required: false
    default: CHANGELOG.md
  ci-workflow:
    description: Name of the workflow whose newest completed run must be green.
    required: false
    default: CI
  token:
    description: A token with actions:read, for the CI query (github.token).
    required: true
outputs:
  tag:
    description: 'free when v<version> does not exist yet, otherwise exists.'
    value: ${{ steps.check.outputs.tag }}
runs:
  using: composite
  steps:
    - name: Preflight
      id: check
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DRY: ${{ inputs.dry-run }}
        CRATES: ${{ inputs.crates }}
        CHANGELOG: ${{ inputs.changelog }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
      run: |
        set -eu
        fail() { echo "::error::$1"; exit 1; }
        soft() { if [ "$DRY" = "true" ]; then echo "::warning::$1"; else fail "$1"; fi; }

        case "$VERSION" in
          v*) fail "version must not start with v" ;;
          [0-9]*.[0-9]*.[0-9]*) : ;;
          *) fail "version must look like MAJOR.MINOR.PATCH" ;;
        esac

        # Every listed manifest must carry this version and must no longer be
        # publish = false.
        printf '%s\n' "$CRATES" | while IFS= read -r man; do
          [ -n "$man" ] || continue
          [ -f "$man" ] || fail "$man does not exist"
          v=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' "$man" | head -1)
          [ "$v" = "$VERSION" ] || fail "$man says version $v, expected $VERSION"
          if grep -q '^publish = false' "$man"; then
            soft "$man is still publish = false; remove it to release"
          fi
        done

        # The tag must not already exist: a protected tag cannot be moved.
        if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
          soft "tag v$VERSION already exists, and protected tags cannot be moved"
          echo "tag=exists" >> "$GITHUB_OUTPUT"
        else
          echo "tag=free" >> "$GITHUB_OUTPUT"
        fi

        # A changelog section for this version must exist and be non-empty.
        [ -f "$CHANGELOG" ] || fail "$CHANGELOG does not exist"
        awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' \
          "$CHANGELOG" > /tmp/preflight-notes.md
        grep -q '[^[:space:]]' /tmp/preflight-notes.md || fail "$CHANGELOG has no ## $VERSION section"

        # The newest completed run of the CI workflow for this commit must be
        # green.
        sha=$(git rev-parse HEAD)
        concl=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&status=completed" \
          | jq -r --arg w "$CI_WORKFLOW" '[.workflow_runs[] | select(.name == $w)] | sort_by(.created_at) | last | .conclusion // "none"')
        [ "$concl" = "success" ] || soft "newest $CI_WORKFLOW run for $sha is '$concl', not success"

        echo "::notice::preflight passed for $VERSION at $sha"
