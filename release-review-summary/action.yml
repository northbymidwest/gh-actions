name: release review summary
description: >-
  Write the table a release approver reads to the job summary: version, commit,
  the green CI run, the tag state, the crates.io state, any repo-specific rows,
  and the release notes verbatim from the changelog. Run it in the preflight
  job, after release-preflight, so the summary is on the run page the approval
  links to. It states what approving will do; on a dry run it says so.
inputs:
  version:
    description: The version to release, without a leading v.
    required: true
  dry-run:
    description: Whether this is a rehearsal.
    required: false
    default: "true"
  tag:
    description: release-preflight's 'tag' output (free or exists).
    required: false
    default: ""
  registry:
    description: release-preflight's 'registry' output (the crates.io summary).
    required: false
    default: ""
  what-approving-does:
    description: >-
      The one-line description of the irreversible actions, e.g.
      "publishes gputrace-bundle and tags v<version>". Shown in the heading.
    required: false
    default: "tags this release"
  extra-rows:
    description: >-
      Optional newline-separated 'label|value' pairs, appended to the table as
      extra rows (e.g. a cross-repo prerequisite's state).
    required: false
    default: ""
  changelog:
    description: Path to the changelog whose "## <version>" section is the notes.
    required: false
    default: CHANGELOG.md
  ci-workflow:
    description: Name of the CI workflow to link its green run for this commit.
    required: false
    default: CI
  token:
    description: A token with actions:read, for the CI-run link (github.token).
    required: true
  working-directory:
    description: Directory of the checked-out repository.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: For review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
        DRY: ${{ inputs.dry-run }}
        TAG: ${{ inputs.tag }}
        REGISTRY: ${{ inputs.registry }}
        DOES: ${{ inputs.what-approving-does }}
        EXTRA: ${{ inputs.extra-rows }}
        CHANGELOG: ${{ inputs.changelog }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/runs
      run: bash "$GITHUB_ACTION_PATH/summary.sh"
