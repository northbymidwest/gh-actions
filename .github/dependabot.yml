version: 2
updates:
  # The only mechanism that moves the SHA-pinned action versions in the
  # workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels: []
    # One PR for all action bumps, so multi-`uses:` actions (e.g. codeql-action
    # init + analyze) move together rather than in separate, version-mismatched PRs.
    groups:
      actions:
        patterns:
          - "*"
